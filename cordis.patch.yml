# dsh-animations bundle layer（动效技能包）。
#
# 声明于 package.json 的 dsh.bundle.patch，由 DSH/KCoder 主进程物化到
# web profile 的 node_modules 并注册进 dsh.profile.bundles。本层只挂
# 一个胶水插件：激活时扫描包内 skills/manifest.json，把 8 个 HTML 动画
# 技能注册为 runtime skill，并向 systemPrompt 注入一段能力通告
# （可经 config.announceToAgent 关闭）。后续层（profile 自身
# cordis.patch.yml、--patch 覆盖）可按行 id 覆写或禁用本行。

- insert:
    - id: dsh-animations
      name: 'dsh-animations'
